  <script>
    (function () {
      try {
        var t = localStorage.getItem("f2-ai-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <style>
:root, [data-theme="light"] {
  --canvas: #ffffff;
  --surface: #f7f6f3;
  --ink: #37352f;
  --body: #4f4d47;
  --muted: #787774;
  --primary: #2383e2;
  --primary-active: #1a6fc1;
  --success: #0f7b3f;
  --warning: #cb6800;
  --danger: #d44c47;
  --hairline: rgba(55, 53, 47, 0.09);
  --radius: 10px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --shadow: 0 1px 2px rgba(55, 53, 47, 0.04), 0 4px 12px rgba(55, 53, 47, 0.06);
  --toggle-bg: #ffffff;
  --toggle-border: rgba(55, 53, 47, 0.14);
  --caption-bg: rgba(255, 255, 255, 0.96);
  --caption-fg: #37352f;
  --anim-bg: #f7f6f3;
  --anim-panel: #ffffff;
  --anim-soft: #e8e6e1;
  --anim-soft-2: #ddd9d2;
  --anim-border: #c5c1b8;
}

[data-theme="dark"] {
  --canvas: #202020;
  --surface: #151515;
  --ink: #f1f0ec;
  --body: #cfcbc4;
  --muted: #9a968e;
  --primary: #5ba8f5;
  --primary-active: #7bb8f7;
  --success: #3dcf7a;
  --warning: #e0a04a;
  --danger: #f07171;
  --hairline: rgba(255, 255, 255, 0.1);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(0, 0, 0, 0.28);
  --toggle-bg: #202020;
  --toggle-border: rgba(255, 255, 255, 0.14);
  --caption-bg: rgba(32, 32, 32, 0.96);
  --caption-fg: #f1f0ec;
  --anim-bg: #1a1a1a;
  --anim-panel: #262626;
  --anim-soft: #333333;
  --anim-soft-2: #3d3d3d;
  --anim-border: #555555;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: Inter, system-ui, sans-serif;
  color: var(--body);
  background: var(--surface);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button, a { font: inherit; }
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.app {
  width: min(880px, calc(100% - 28px));
  margin: 0 auto;
  padding: 28px 0 40px;
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 20px;
}

.header-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  margin-bottom: 4px;
}

.theme-toggle {
  display: inline-flex;
  border: 1px solid var(--toggle-border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--toggle-bg);
}

.theme-toggle button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 600;
  padding: 8px 12px;
  cursor: pointer;
  line-height: 1;
}

.theme-toggle button[aria-pressed="true"] {
  background: var(--primary);
  color: #fff;
}

.eyebrow, .mono {
  font-family: "JetBrains Mono", ui-monospace, monospace;
}

.eyebrow {
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 6px;
}

h1, h2 { font-family: "Cormorant Garamond", Georgia, serif; color: var(--ink); }
h1 { font-size: clamp(1.85rem, 4.5vw, 2.45rem); line-height: 1.15; }

.progress-wrap { min-width: 160px; width: min(220px, 100%); }
.progress-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; text-align: right; }
.progress-bar { height: 3px; background: var(--hairline); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--primary); transition: width 0.36s var(--ease); }

.jump-nav {
  width: 100%;
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 1px 7px;
  scrollbar-width: thin;
}

.jump-btn {
  flex: 0 0 auto;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: var(--canvas);
  color: var(--muted);
  padding: 6px 10px;
  font: 600 0.66rem "JetBrains Mono", monospace;
  cursor: pointer;
}

.jump-btn:hover { color: var(--primary); border-color: var(--primary); }
.jump-btn.active { color: #fff; background: var(--primary); border-color: var(--primary); }

.panel {
  background: var(--canvas);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.hidden { display: none !important; }

footer.note {
  margin-top: 14px;
  color: var(--muted);
  font-size: 0.78rem;
  text-align: center;
}


.intro, .summary { padding: 28px 22px; }
.intro h2, .summary h2, .section-title {
  font-size: clamp(1.4rem, 3vw, 1.75rem);
  margin-bottom: 10px;
  line-height: 1.2;
}

.intro p, .summary p, .section-body {
  line-height: 1.65;
  margin-bottom: 12px;
  font-size: 0.95rem;
}

strong { color: var(--ink); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 17px 0 21px; }
.chip {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 6px 10px;
  border: 1px solid var(--hairline);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
}

.stage {
  padding: 18px;
  border-bottom: 1px solid var(--hairline);
  background: var(--surface);
}

.badge {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 4px 10px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  font-size: 0.78rem;
  color: var(--muted);
  background: var(--canvas);
  margin-bottom: 12px;
}

.badge strong { font-family: "JetBrains Mono", monospace; }

.scene {
  width: 100%;
  min-height: 300px;
  border: 1px solid var(--hairline);
  border-radius: 10px;
  background: var(--anim-bg);
  position: relative;
  overflow: hidden;
  display: grid;
  place-items: center;
}

.scene-caption {
  position: absolute;
  z-index: 8;
  left: 10px;
  bottom: 8px;
  max-width: 92%;
  color: var(--caption-fg);
  background: var(--caption-bg);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  padding: 4px 8px;
  box-shadow: var(--shadow);
  font-size: 0.7rem;
  font-weight: 600;
  line-height: 1.35;
}

.content { padding: 20px 18px 18px; }

.definition {
  border-left: 3px solid var(--primary);
  padding: 10px 12px;
  margin: 12px 0 15px;
  background: var(--surface);
  color: var(--ink);
  line-height: 1.55;
  font-size: 0.92rem;
}

.definition::before {
  content: "DEFINITION";
  display: block;
  font: 600 0.62rem "JetBrains Mono", monospace;
  color: var(--primary);
  letter-spacing: 0.05em;
  margin-bottom: 5px;
}

.example-box {
  border: 1px solid var(--hairline);
  border-radius: 9px;
  padding: 12px;
  margin: 14px 0 4px;
  background: var(--surface);
  font-size: 0.88rem;
  line-height: 1.55;
}

.example-box b {
  display: block;
  font: 600 0.65rem "JetBrains Mono", monospace;
  color: var(--primary);
  margin-bottom: 5px;
  letter-spacing: 0.04em;
}

.nav {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 17px;
}

.btn {
  border: 0;
  border-radius: 8px;
  padding: 10px 16px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: 0.18s ease;
}

.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn-primary { color: #fff; background: var(--primary); margin-left: auto; }
.btn-primary:hover:not(:disabled) { background: var(--primary-active); }
.btn-ghost { color: var(--muted); background: transparent; border: 1px solid var(--hairline); }

.recap-list { display: grid; gap: 7px; margin: 15px 0 18px; }
.recap-item {
  display: grid;
  grid-template-columns: 118px 1fr;
  gap: 10px;
  padding: 9px 10px;
  border-bottom: 1px solid var(--hairline);
  font-size: 0.85rem;
  line-height: 1.45;
}
.recap-item b {
  font-family: "JetBrains Mono", monospace;
  color: var(--primary);
  font-size: 0.68rem;
}

.frame {
  width: 100%;
  min-height: 300px;
  padding: 22px 18px 44px;
  display: grid;
  place-items: center;
}

.arrow {
  font: 600 1.05rem "JetBrains Mono", monospace;
  color: var(--primary);
  animation: nudge 1.2s ease-in-out infinite;
}

.pipe {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
  width: 100%;
}

.pipe-step {
  flex: 1;
  min-width: 90px;
  max-width: 140px;
  padding: 10px 8px;
  border: 1px solid var(--anim-border);
  border-radius: 8px;
  background: var(--anim-panel);
  text-align: center;
  font: 600 0.55rem "JetBrains Mono", monospace;
  color: var(--ink);
  line-height: 1.35;
  opacity: 0.45;
}

.pipe-step.on {
  opacity: 1;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 20%, transparent);
  animation: pulseGlow 1.8s ease-in-out infinite;
}

.pipe-step b {
  display: block;
  color: var(--primary);
  font-size: 0.5rem;
  margin-bottom: 4px;
}

.flow-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  width: min(520px, 100%);
}

.node {
  min-width: 100px;
  padding: 12px 10px;
  border: 1px solid var(--anim-border);
  border-radius: 10px;
  background: var(--anim-panel);
  text-align: center;
  font: 600 0.62rem "JetBrains Mono", monospace;
  color: var(--ink);
}

.node .mono {
  display: block;
  color: var(--primary);
  font-size: 0.52rem;
  margin-bottom: 4px;
}

.node.on {
  border-color: var(--primary);
  animation: pulseGlow 1.8s ease-in-out infinite;
}

.compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: min(520px, 100%);
}

.cmp {
  border: 1px solid var(--anim-border);
  border-radius: 8px;
  background: var(--anim-panel);
  padding: 10px;
  font-size: 0.68rem;
  line-height: 1.45;
  color: var(--ink);
}

.cmp .mono {
  display: block;
  color: var(--primary);
  margin-bottom: 6px;
  font-size: 0.58rem;
}

.pair-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 12px 0;
}

.pair-card {
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 10px;
  background: var(--surface);
  font-size: 0.82rem;
  line-height: 1.45;
}

.pair-card b {
  display: block;
  font: 600 0.62rem "JetBrains Mono", monospace;
  color: var(--primary);
  margin-bottom: 5px;
}

@keyframes nudge { 50% { transform: translateX(4px); } }
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 18%, transparent); }
  50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--primary) 10%, transparent); }
}

@media (max-width: 560px) {
  .compare, .pair-grid, .recap-item { grid-template-columns: 1fr; }
}

@media (max-width: 390px) {
  .app { width: calc(100% - 20px); padding: 18px 0 32px; }
  .content, .intro, .summary { padding-left: 14px; padding-right: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .arrow, .pipe-step.on, .node.on { animation: none !important; }
}

</style>
  <style>
    /* ── Brain network (single SVG = aligned wires) ── */
    .brain-live {
      width: min(540px, 100%);
      display: grid;
      gap: 10px;
    }

    .brain-prompt {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--anim-border);
      border-radius: 10px;
      background: var(--anim-panel);
    }

    .brain-prompt .q {
      font: 600 0.74rem Inter, system-ui, sans-serif;
      color: var(--ink);
      line-height: 1.35;
    }

    .kw {
      font: 700 0.52rem "JetBrains Mono", monospace;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--anim-border);
      color: var(--muted);
      background: var(--anim-bg);
      opacity: 0.4;
    }

    .kw.on {
      color: var(--primary);
      border-color: var(--primary);
      animation: kwPulse 8s ease-in-out infinite;
    }
    .kw.on:nth-child(2) { animation-delay: 0.15s; }
    .kw.on:nth-child(3) { animation-delay: 0.45s; }
    .kw.on:nth-child(4) { animation-delay: 0.75s; }

    @keyframes kwPulse {
      0%, 6%, 100% { opacity: 0.35; box-shadow: none; }
      10%, 20% { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
      28% { opacity: 0.55; }
    }

    .brain-svg-wrap {
      width: 100%;
      border: 1px solid var(--anim-border);
      border-radius: 12px;
      background:
        radial-gradient(ellipse at 50% 48%, color-mix(in srgb, var(--primary) 7%, transparent), transparent 62%),
        var(--anim-bg);
      overflow: hidden;
    }

    .brain-svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 560 / 250;
    }

    .brain-svg .link-idle {
      fill: none;
      stroke: var(--anim-border);
      stroke-width: 1.4;
      opacity: 0.55;
    }

    .brain-svg .link-relay {
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-dasharray: 7 9;
      opacity: 0;
      animation: relayDraw 8s ease-in-out infinite;
    }
    .brain-svg .link-relay.r1 { animation-delay: 1.2s; }
    .brain-svg .link-relay.r2 { animation-delay: 2.2s; }
    .brain-svg .link-relay.r3 { animation-delay: 3.2s; }
    .brain-svg .link-relay.r4 { animation-delay: 4.2s; }

    @keyframes relayDraw {
      0%, 6%, 100% { opacity: 0; stroke-dashoffset: 28; }
      12%, 26% { opacity: 1; stroke-dashoffset: 0; }
      38% { opacity: 0.12; }
    }

    .brain-svg .soma {
      fill: var(--anim-panel);
      stroke: var(--anim-border);
      stroke-width: 1.6;
    }
    .brain-svg .nucleus {
      fill: var(--anim-soft-2);
    }
    .brain-svg .dend {
      fill: none;
      stroke: var(--anim-border);
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: 0.7;
    }
    .brain-svg .n-label {
      font: 700 9px "JetBrains Mono", monospace;
      fill: var(--muted);
      text-anchor: middle;
    }

    .brain-svg .chain .soma { opacity: 1; }
    .brain-svg .chain .nucleus { opacity: 1; }
    .brain-svg .chain .dend { opacity: 0.85; }

    .brain-svg .chain { opacity: 0.42; }

    .brain-svg .chain.c0 { animation: somaFire 8s ease-in-out infinite; animation-delay: 1.1s; }
    .brain-svg .chain.c1 { animation: somaFire 8s ease-in-out infinite; animation-delay: 2.1s; }
    .brain-svg .chain.c2 { animation: somaFire 8s ease-in-out infinite; animation-delay: 3.1s; }
    .brain-svg .chain.c3 { animation: somaFire 8s ease-in-out infinite; animation-delay: 4.1s; }
    .brain-svg .chain.c4 { animation: somaOut 8s ease-in-out infinite; animation-delay: 5.1s; }

    @keyframes somaFire {
      0%, 5%, 100% { opacity: 0.4; }
      10%, 24% { opacity: 1; filter: drop-shadow(0 0 5px color-mix(in srgb, var(--primary) 55%, transparent)); }
      10% { }
      32% { opacity: 0.55; filter: none; }
    }
    @keyframes somaOut {
      0%, 5%, 100% { opacity: 0.4; }
      10%, 40% { opacity: 1; filter: drop-shadow(0 0 7px color-mix(in srgb, var(--success) 50%, transparent)); }
      55% { opacity: 0.7; filter: none; }
    }

    .brain-svg .chain.c0 .soma,
    .brain-svg .chain.c1 .soma,
    .brain-svg .chain.c2 .soma,
    .brain-svg .chain.c3 .soma { stroke: var(--primary); }
    .brain-svg .chain.c0 .nucleus,
    .brain-svg .chain.c1 .nucleus,
    .brain-svg .chain.c2 .nucleus,
    .brain-svg .chain.c3 .nucleus { fill: var(--primary); }
    .brain-svg .chain.c0 .dend,
    .brain-svg .chain.c1 .dend,
    .brain-svg .chain.c2 .dend,
    .brain-svg .chain.c3 .dend { stroke: var(--primary); }

    .brain-svg .chain.c4 .soma { stroke: var(--success); }
    .brain-svg .chain.c4 .nucleus { fill: var(--success); }
    .brain-svg .chain.c4 .dend { stroke: var(--success); }
    .brain-svg .chain.c4 .n-label { fill: var(--success); }

    .brain-svg .pulse-dot {
      fill: var(--primary);
      opacity: 0;
      animation: pulseHop 8s ease-in-out infinite;
    }
    .brain-svg .pulse-dot.p1 { animation-delay: 1.35s; }
    .brain-svg .pulse-dot.p2 { animation-delay: 2.35s; }
    .brain-svg .pulse-dot.p3 { animation-delay: 3.35s; }
    .brain-svg .pulse-dot.p4 { animation-delay: 4.35s; }

    @keyframes pulseHop {
      0%, 8%, 100% { opacity: 0; }
      12%, 22% { opacity: 1; }
      30% { opacity: 0; }
    }

    .brain-conclusion {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: 600 0.58rem "JetBrains Mono", monospace;
      color: var(--muted);
    }
    .brain-conclusion .ans {
      padding: 5px 11px;
      border-radius: 6px;
      border: 1px solid var(--anim-border);
      background: var(--anim-panel);
      opacity: 0.35;
      animation: ansReveal 8s ease-in-out infinite;
      animation-delay: 5.3s;
    }
    @keyframes ansReveal {
      0%, 6%, 100% { opacity: 0.3; color: var(--muted); border-color: var(--anim-border); }
      12%, 50% {
        opacity: 1;
        color: var(--success);
        border-color: var(--success);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 14%, transparent);
      }
      65% { opacity: 0.55; }
    }

    /* ── Neuron diagram image ── */
    .neuron-diagram {
      width: min(520px, 100%);
    }

    .neuron-diagram img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #fff;
      border: 1px solid var(--anim-border);
    }

    [data-theme="dark"] .neuron-diagram img {
      background: #fff;
    }

    /* ── Multilayer network ── */
    .net-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: min(540px, 100%);
      padding: 8px 0;
    }

    .layer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .layer-label {
      font: 700 0.44rem "JetBrains Mono", monospace;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .layer-node {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--anim-border);
      background: var(--anim-panel);
      opacity: 0.4;
    }

    .layer.in .layer-node { animation: layerSeq 6s ease-in-out infinite; }
    .layer.in .layer-node:nth-child(2) { animation-delay: 0s; }
    .layer.in .layer-node:nth-child(3) { animation-delay: 0.15s; }
    .layer.in .layer-node:nth-child(4) { animation-delay: 0.3s; }

    .layer.hidden .layer-node { animation: layerSeq 6s ease-in-out infinite; animation-delay: 1.2s; }
    .layer.hidden .layer-node:nth-child(2) { animation-delay: 1.2s; }
    .layer.hidden .layer-node:nth-child(3) { animation-delay: 1.35s; }
    .layer.hidden .layer-node:nth-child(4) { animation-delay: 1.5s; }
    .layer.hidden .layer-node:nth-child(5) { animation-delay: 1.65s; }

    .layer.out .layer-node { animation: layerSeq 6s ease-in-out infinite; animation-delay: 2.4s; }
    .layer.out .layer-node:nth-child(2) { animation-delay: 2.4s; }
    .layer.out .layer-node:nth-child(3) { animation-delay: 2.55s; }

    @keyframes layerSeq {
      0%, 100% { opacity: 0.35; border-color: var(--anim-border); box-shadow: none; }
      12% { opacity: 1; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
      24% { opacity: 0.35; border-color: var(--anim-border); box-shadow: none; }
    }

    .layer-arrow {
      font: 600 0.9rem "JetBrains Mono", monospace;
      color: var(--primary);
      opacity: 0.6;
      flex-shrink: 0;
    }

    /* ── Deep network (horizontal) ── */
    .dnn-wrap {
      width: min(540px, 100%);
      border: 1px solid var(--anim-border);
      border-radius: 12px;
      background: var(--anim-panel);
      padding: 10px 8px 6px;
      overflow: hidden;
    }

    .dnn-svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 560 / 280;
    }

    .dnn-svg .title {
      font: 700 18px Inter, system-ui, sans-serif;
      fill: var(--ink);
    }
    .dnn-svg .layer-cap {
      font: 600 11px Inter, system-ui, sans-serif;
      fill: var(--muted);
      text-anchor: middle;
    }

    .dnn-svg .edge.live {
      fill: none;
      stroke: #3ec6d8;
      stroke-width: 1.15;
      opacity: 0.18;
      animation: edgeWave 3.6s ease-in-out infinite;
    }
    .dnn-svg .edge.live.e0 { stroke: #1f5cff; animation-delay: 0s; }
    .dnn-svg .edge.live.e1 { animation-delay: 0.55s; }
    .dnn-svg .edge.live.e2 { animation-delay: 1.1s; }
    .dnn-svg .edge.live.e3 { animation-delay: 1.65s; }

    @keyframes edgeWave {
      0%, 10%, 100% { opacity: 0.14; }
      22%, 40% { opacity: 0.72; }
      55% { opacity: 0.18; }
    }

    .dnn-svg .node {
      stroke: none;
    }
    .dnn-svg .node.in { fill: #1f5cff; }
    .dnn-svg .node.hid { fill: #3ec6d8; }
    .dnn-svg .node.out { fill: #8eb6ff; }

    .dnn-svg .node.glow {
      animation: nodeWave 3.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .dnn-svg .L0 .node.glow { animation-delay: 0s; }
    .dnn-svg .L1 .node.glow { animation-delay: 0.55s; }
    .dnn-svg .L2 .node.glow { animation-delay: 1.1s; }
    .dnn-svg .L3 .node.glow { animation-delay: 1.65s; }
    .dnn-svg .L4 .node.glow { animation-delay: 2.2s; }

    @keyframes nodeWave {
      0%, 10%, 100% { opacity: 0.55; filter: none; }
      20%, 40% {
        opacity: 1;
        filter: drop-shadow(0 0 6px rgba(62, 198, 216, 0.75));
      }
      55% { opacity: 0.65; filter: none; }
    }

    .dnn-svg .L0 .node.glow {
      animation-name: nodeWaveIn;
    }
    @keyframes nodeWaveIn {
      0%, 10%, 100% { opacity: 0.55; filter: none; }
      20%, 40% {
        opacity: 1;
        filter: drop-shadow(0 0 7px rgba(31, 92, 255, 0.7));
      }
      55% { opacity: 0.65; filter: none; }
    }

    .dnn-svg .packet {
      fill: #2383e2;
      opacity: 0;
      animation: packetHop 3.6s ease-in-out infinite;
    }
    .dnn-svg .packet.p0 { animation-delay: 0.15s; }
    .dnn-svg .packet.p1 { animation-delay: 0.7s; }
    .dnn-svg .packet.p2 { animation-delay: 1.25s; }
    .dnn-svg .packet.p3 { animation-delay: 1.8s; }

    @keyframes packetHop {
      0%, 8%, 100% { opacity: 0; }
      14%, 28% { opacity: 1; }
      36% { opacity: 0; }
    }

    [data-theme="dark"] .dnn-wrap { background: #1c1c1c; }
    [data-theme="dark"] .dnn-svg .edge { stroke: #4aa8b8; opacity: 0.4; }
    [data-theme="dark"] .dnn-svg .edge.live { stroke: #5ba8f5; }

    /* ── MNIST DNN diagram ── */
    .mnist-dnn-wrap {
      width: min(560px, 100%);
      border: 1px solid var(--anim-border);
      border-radius: 12px;
      background: var(--anim-panel);
      overflow: hidden;
    }

    .mnist-dnn {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 720 / 360;
    }

    .mnist-dnn .lab {
      font: 600 10px Inter, system-ui, sans-serif;
      fill: #2383e2;
    }
    .mnist-dnn .lab-red {
      font: 600 10px Inter, system-ui, sans-serif;
      fill: #d44c47;
      text-anchor: middle;
    }
    .mnist-dnn .out-lab {
      font: 700 9px "JetBrains Mono", monospace;
      fill: var(--ink);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .mnist-dnn .lab-mute {
      font: 600 9px Inter, system-ui, sans-serif;
      fill: var(--muted);
      text-anchor: middle;
    }
    .mnist-dnn .box {
      fill: none;
      stroke: #2383e2;
      stroke-width: 1.4;
      rx: 10;
    }
    .mnist-dnn .edge {
      stroke: #8a8a8a;
      stroke-width: 0.55;
      fill: none;
      opacity: 0.28;
    }
    .mnist-dnn .edge.live {
      stroke: #2383e2;
      stroke-width: 1;
      opacity: 0.12;
      animation: mnEdge 5.5s ease-in-out infinite;
    }
    .mnist-dnn .edge.live.e0 { animation-delay: 0.5s; }
    .mnist-dnn .edge.live.e1 { animation-delay: 1.4s; }
    .mnist-dnn .edge.live.e2 { animation-delay: 2.3s; }
    .mnist-dnn .edge.live.e3 { animation-delay: 3.2s; }

    @keyframes mnEdge {
      0%, 10%, 100% { opacity: 0.1; }
      22%, 38% { opacity: 0.55; }
      50% { opacity: 0.12; }
    }

    .mnist-dnn .node {
      fill: #fff;
      stroke: #555;
      stroke-width: 1.2;
    }
    [data-theme="dark"] .mnist-dnn .node {
      fill: #2a2a2a;
      stroke: #aaa;
    }

    .mnist-dnn .L0 .node,
    .mnist-dnn .L1 .node,
    .mnist-dnn .L2 .node,
    .mnist-dnn .L3 .node {
      animation: mnNode 5.5s ease-in-out infinite;
    }
    .mnist-dnn .L0 .node { animation-delay: 0.5s; }
    .mnist-dnn .L1 .node { animation-delay: 1.4s; }
    .mnist-dnn .L2 .node { animation-delay: 2.3s; }
    .mnist-dnn .L3 .node { animation-delay: 3.2s; }

    @keyframes mnNode {
      0%, 10%, 100% { opacity: 0.55; }
      20%, 40% {
        opacity: 1;
        fill: #dcebff;
        stroke: #2383e2;
        filter: drop-shadow(0 0 3px rgba(35, 131, 226, 0.45));
      }
      55% { opacity: 0.7; filter: none; }
    }

    [data-theme="dark"] .mnist-dnn .L0 .node,
    [data-theme="dark"] .mnist-dnn .L1 .node,
    [data-theme="dark"] .mnist-dnn .L2 .node,
    [data-theme="dark"] .mnist-dnn .L3 .node {
      animation-name: mnNodeDark;
    }
    @keyframes mnNodeDark {
      0%, 10%, 100% { opacity: 0.55; }
      20%, 40% {
        opacity: 1;
        fill: #1a3350;
        stroke: #5ba8f5;
        filter: drop-shadow(0 0 4px rgba(91, 168, 245, 0.45));
      }
      55% { opacity: 0.7; filter: none; }
    }

    .mnist-dnn .out-win {
      animation: mnWin 5.5s ease-in-out infinite;
      animation-delay: 3.6s;
    }
    .mnist-dnn .out-win circle {
      stroke: #0f7b3f;
      stroke-width: 2;
    }
    @keyframes mnWin {
      0%, 12%, 100% { opacity: 0.55; filter: none; }
      25%, 85% {
        opacity: 1;
        filter: drop-shadow(0 0 6px rgba(15, 123, 63, 0.55));
      }
    }

    .mnist-dnn .flat-arrow {
      stroke: var(--ink);
      stroke-width: 1.4;
      fill: none;
      marker-end: url(#mnArrow);
      animation: flatPulse 5.5s ease-in-out infinite;
      animation-delay: 0.15s;
    }
    @keyframes flatPulse {
      0%, 8%, 100% { opacity: 0.35; }
      14%, 30% { opacity: 1; }
      40% { opacity: 0.5; }
    }

    .mnist-dnn .digit-px { fill: #111; }
    .mnist-dnn .digit-bg { fill: #f4f4f4; stroke: #bbb; stroke-width: 1; }
    [data-theme="dark"] .mnist-dnn .digit-bg { fill: #eee; }

    .mnist-dnn .pred {
      font: 700 11px "JetBrains Mono", monospace;
      fill: var(--muted);
      text-anchor: middle;
    }
    .mnist-dnn .pred tspan {
      fill: #0f7b3f;
      animation: ansPop 5.5s ease-in-out infinite;
      animation-delay: 3.8s;
    }
    @keyframes ansPop {
      0%, 12%, 100% { opacity: 0.3; }
      25%, 85% { opacity: 1; }
    }

    /* ── Link-back to training data ── */
    .link-stage {
      display: grid;
      gap: 12px;
      width: min(480px, 100%);
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .link-chip {
      padding: 10px 14px;
      border: 1px solid var(--anim-border);
      border-radius: 8px;
      background: var(--anim-panel);
      font: 600 0.55rem "JetBrains Mono", monospace;
      color: var(--ink);
      text-align: center;
      line-height: 1.35;
    }

    .link-chip.ann { border-color: var(--primary); color: var(--primary); }
    .link-chip.data { border-color: var(--warning); color: var(--warning); animation: dataWarn 3s ease-in-out infinite; }

    @keyframes dataWarn {
      0%, 100% { box-shadow: none; }
      50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warning) 14%, transparent); }
    }

    .link-eq {
      font: 700 0.65rem "JetBrains Mono", monospace;
      color: var(--muted);
    }

    .formula-strip {
      padding: 10px 14px;
      border-left: 3px solid var(--primary);
      background: var(--anim-soft);
      border-radius: 0 8px 8px 0;
      font: 600 0.58rem "JetBrains Mono", monospace;
      color: var(--ink);
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 560px) {
      .net-stage { gap: 3px; }
      .layer-node { width: 28px; height: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .layer-node, .link-chip.data,
      .kw.on, .brain-svg .link-relay, .brain-svg .chain,
      .brain-svg .pulse-dot, .brain-conclusion .ans,
      .dnn-svg .node.glow, .dnn-svg .edge.live, .dnn-svg .packet,
      .mnist-dnn .edge.live, .mnist-dnn .L0 .node, .mnist-dnn .L1 .node,
      .mnist-dnn .L2 .node, .mnist-dnn .L3 .node, .mnist-dnn .out-win,
      .mnist-dnn .flat-arrow, .mnist-dnn .pred tspan {
        animation: none !important;
      }
      .kw.on, .brain-svg .chain, .brain-conclusion .ans,
      .dnn-svg .node.glow, .mnist-dnn .out-win, .mnist-dnn .pred tspan { opacity: 1; }
      .brain-svg .link-relay, .dnn-svg .edge.live, .mnist-dnn .edge.live { opacity: 0.55; }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
(function () {
  "use strict";

  function $(id) {
    return document.getElementById(id);
  }

  function caption(text) {
    return `<div class="scene-caption">${text}</div>`;
  }

  function applyTheme(theme) {
    const next = theme === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try {
      localStorage.setItem("f2-ai-theme", next);
    } catch (e) {}
    const light = $("lightBtn");
    const dark = $("darkBtn");
    if (light) light.setAttribute("aria-pressed", next === "light" ? "true" : "false");
    if (dark) dark.setAttribute("aria-pressed", next === "dark" ? "true" : "false");
  }

  function initTheme() {
    let t = "light";
    try {
      const saved = localStorage.getItem("f2-ai-theme");
      if (saved === "dark" || saved === "light") t = saved;
    } catch (e) {}
    applyTheme(t);
    $("lightBtn") && $("lightBtn").addEventListener("click", () => applyTheme("light"));
    $("darkBtn") && $("darkBtn").addEventListener("click", () => applyTheme("dark"));
  }

  function mount(config) {
    const sections = config.sections || [];
    const jumpLabels = config.jumpLabels || sections.map((s) => s.name);
    const summaryItems = (config.summary && config.summary.items) || [];
    let index = 0;

    const root = $("app");
    if (!root) return;

    root.innerHTML = `
      <header>
        <div class="header-top">
          <div class="theme-toggle" role="group" aria-label="Colour theme">
            <button type="button" id="lightBtn" aria-pressed="true">Light</button>
            <button type="button" id="darkBtn" aria-pressed="false">Dark</button>
          </div>
          <div class="progress-wrap">
            <div class="progress-label" id="progressText">Ready</div>
            <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
          </div>
        </div>
        <div>
          <p class="eyebrow">${config.eyebrow || ""}</p>
          <h1>${config.title || ""}</h1>
        </div>
        <nav class="jump-nav" id="jumpNav" aria-label="Jump to a section"></nav>
      </header>

      <main class="panel">
        <section class="intro" id="intro">
          <h2>${(config.intro && config.intro.h2) || ""}</h2>
          <p>${(config.intro && config.intro.p) || ""}</p>
          <div class="chips" aria-label="Topics">${(config.intro && config.intro.chips || [])
            .map((c) => `<span class="chip">${c}</span>`)
            .join("")}</div>
          <div class="nav"><span></span><button class="btn btn-primary" id="startBtn" type="button">Start exploring</button></div>
        </section>

        <section id="mainScreen" class="hidden">
          <div class="stage">
            <span class="badge"><strong id="sectionCode">01</strong><span id="sectionName"></span></span>
            <div class="scene" id="scene" aria-live="polite"></div>
          </div>
          <div class="content">
            <h2 class="section-title" id="sectionTitle"></h2>
            <div class="definition" id="definition"></div>
            <p class="section-body" id="sectionBody"></p>
            <div id="extra"></div>
            <div class="nav">
              <button class="btn btn-ghost" id="backBtn" type="button">Back</button>
              <button class="btn btn-primary" id="nextBtn" type="button">Next</button>
            </div>
          </div>
        </section>

        <section class="summary hidden" id="summary">
          <h2>${(config.summary && config.summary.title) || "Learning summary"}</h2>
          <p>${(config.summary && config.summary.p) || ""}</p>
          <div class="recap-list">
            ${summaryItems
              .map((it) => `<div class="recap-item"><b>${it.b}</b><span>${it.span}</span></div>`)
              .join("")}
          </div>
          <div class="nav">
            <button class="btn btn-ghost" id="reviewBtn" type="button">Review from start</button>
            <button class="btn btn-primary" id="restartBtn" type="button">Restart</button>
          </div>
        </section>
      </main>
      <footer class="note">Based on EDB Booklet 2 Unit 1 · Artificial Neural Networks by Valtorta College</footer>
    `;

    initTheme();

    const els = {
      intro: $("intro"),
      main: $("mainScreen"),
      summary: $("summary"),
      scene: $("scene"),
      code: $("sectionCode"),
      name: $("sectionName"),
      title: $("sectionTitle"),
      definition: $("definition"),
      body: $("sectionBody"),
      extra: $("extra"),
      back: $("backBtn"),
      next: $("nextBtn"),
      progress: $("progressFill"),
      progressText: $("progressText"),
      jumpNav: $("jumpNav")
    };

    function show(which) {
      els.intro.classList.toggle("hidden", which !== "intro");
      els.main.classList.toggle("hidden", which !== "main");
      els.summary.classList.toggle("hidden", which !== "summary");
    }

    function updateProgress() {
      els.progress.style.width = `${((index + 1) / sections.length) * 100}%`;
      els.progressText.textContent = `Section ${index + 1} of ${sections.length}`;
    }

    function updateJumpNav(active) {
      els.jumpNav.querySelectorAll(".jump-btn").forEach((b, i) => {
        b.classList.toggle("active", i === active);
      });
    }

    function loadSection(i) {
      index = i;
      const s = sections[i];
      show("main");
      updateProgress();
      updateJumpNav(i);
      els.code.textContent = s.code;
      els.name.textContent = s.name;
      els.title.textContent = s.title;
      els.definition.innerHTML = s.definition;
      els.body.innerHTML = s.body;
      els.extra.innerHTML = s.extra || "";
      els.next.textContent = i === sections.length - 1 ? "See summary" : "Next";
      if (typeof s.render === "function") s.render(els.scene, caption);
    }

    function showSummary() {
      show("summary");
      els.progress.style.width = "100%";
      els.progressText.textContent = "Complete";
      updateJumpNav(sections.length);
    }

    const allLabels = jumpLabels.concat([(config.summary && config.summary.jump) || "Sum"]);
    els.jumpNav.innerHTML = allLabels
      .map((label, i) => `<button type="button" class="jump-btn" data-jump="${i}">${label}</button>`)
      .join("");

    els.jumpNav.querySelectorAll(".jump-btn").forEach((button) => {
      button.addEventListener("click", () => {
        const t = Number(button.dataset.jump);
        if (t === sections.length) showSummary();
        else loadSection(t);
      });
    });

    $("startBtn").addEventListener("click", () => loadSection(0));
    els.next.addEventListener("click", () =>
      index === sections.length - 1 ? showSummary() : loadSection(index + 1)
    );
    els.back.addEventListener("click", () => {
      if (index === 0) {
        show("intro");
        updateJumpNav(-1);
        els.progress.style.width = "0";
        els.progressText.textContent = "Ready";
      } else loadSection(index - 1);
    });
    $("restartBtn").addEventListener("click", () => loadSection(0));
    $("reviewBtn").addEventListener("click", () => {
      show("intro");
      updateJumpNav(-1);
      els.progress.style.width = "0";
      els.progressText.textContent = "Ready";
    });
  }

  window.F2Lesson = { mount, caption, applyTheme };
})();

</script>
  <script>
    F2Lesson.mount({
      eyebrow: "EDB Booklet 2 · Unit 1",
      title: "Artificial Neural Networks",
      intro: {
        h2: "From brain-inspired idea to deep learning",
        p: "An <strong>Artificial Neural Network (ANN)</strong> is modelled on biological neurons. Stacked layers of simple units can learn complex patterns — and when there are many layers, we call it a <strong>Deep Neural Network (DNN)</strong>. This lesson covers Booklet 2 §1.3.",
        chips: ["NEURON", "PERCEPTRON", "LAYERS", "DNN", "SIGNAL FLOW"]
      },
      jumpLabels: ["Brain", "Neuron", "Layers", "Deep", "Classify", "Data"],
      sections: [
        {
          code: "01",
          name: "Brain",
          title: "How the Human Brain Thinks with Neurons",
          definition: "The brain is a huge network of connected neurons. When you hear a question or recognise keywords, relevant neurons fire and pass signals along linked neurons until a conclusion forms.",
          body: "A single neuron is simple — it either stays quiet or <strong>fires</strong>. Intelligence comes from the <strong>connections</strong>: one firing neuron can trigger the next, chaining through the network. That relay is what ANNs try to imitate with artificial nodes and weights.",
          extra: `<div class="example-box"><b>WATCH THE LOOP</b>Question → keywords light up → one neuron fires → signal hops to neighbours → final neuron settles on an answer.</div>`,
          render(sceneEl, caption) {
            const cell = (cx, cy, cls, label) => `
              <g class="chain ${cls}" transform="translate(${cx} ${cy})">
                <path class="dend" d="M0 0 L-18 -14 M0 0 L-20 2 M0 0 L-14 16 M0 0 L12 -16 M0 0 L18 10"/>
                <circle class="soma" r="13"/>
                <circle class="nucleus" r="5.5"/>
                <text class="n-label" y="28">${label}</text>
              </g>`;
            const idle = (cx, cy) => `
              <g transform="translate(${cx} ${cy})" opacity="0.45">
                <path class="dend" d="M0 0 L-12 -10 M0 0 L-14 4 M0 0 L8 12 M0 0 L11 -9"/>
                <circle class="soma" r="9"/>
                <circle class="nucleus" r="3.5"/>
              </g>`;
            sceneEl.innerHTML = `<div class="frame">
              <div class="brain-live">
                <div class="brain-prompt">
                  <span class="q">“Is that a cat?”</span>
                  <span class="kw on">ears</span>
                  <span class="kw on">whiskers</span>
                  <span class="kw on">meow</span>
                </div>
                <div class="brain-svg-wrap" aria-hidden="true">
                  <svg class="brain-svg" viewBox="0 0 560 250" role="img">
                    <!-- idle side links (exact node centres) -->
                    <path class="link-idle" d="M70 70 L70 120"/>
                    <path class="link-idle" d="M70 170 L70 120"/>
                    <path class="link-idle" d="M170 68 L170 120"/>
                    <path class="link-idle" d="M270 175 L270 120"/>
                    <path class="link-idle" d="M370 68 L370 120"/>
                    <path class="link-idle" d="M470 168 L470 120"/>
                    <path class="link-idle" d="M70 70 L170 68"/>
                    <path class="link-idle" d="M170 68 L270 120"/>
                    <path class="link-idle" d="M270 175 L370 120"/>
                    <path class="link-idle" d="M370 68 L470 120"/>

                    <!-- main relay path: HEAR→MATCH→LINK→DECIDE→YES -->
                    <path class="link-relay r1" d="M83 120 L157 120"/>
                    <path class="link-relay r2" d="M183 120 L257 120"/>
                    <path class="link-relay r3" d="M283 120 L357 120"/>
                    <path class="link-relay r4" d="M383 120 L457 120"/>

                    <circle class="pulse-dot p1" cx="120" cy="120" r="3.5"/>
                    <circle class="pulse-dot p2" cx="220" cy="120" r="3.5"/>
                    <circle class="pulse-dot p3" cx="320" cy="120" r="3.5"/>
                    <circle class="pulse-dot p4" cx="420" cy="120" r="3.5"/>

                    ${idle(70, 70)}
                    ${idle(70, 170)}
                    ${idle(170, 68)}
                    ${idle(270, 175)}
                    ${idle(370, 68)}
                    ${idle(470, 168)}

                    ${cell(70, 120, "c0", "HEAR")}
                    ${cell(170, 120, "c1", "MATCH")}
                    ${cell(270, 120, "c2", "LINK")}
                    ${cell(370, 120, "c3", "DECIDE")}
                    ${cell(470, 120, "c4", "YES")}
                  </svg>
                </div>
                <div class="brain-conclusion">
                  <span>CONCLUSION</span>
                  <span class="ans">CAT</span>
                </div>
              </div>
            </div>${caption("Keywords trigger a neuron; the signal hops through connected neurons until a conclusion.")}`;
          }
        },
        {
          code: "02",
          name: "Neuron",
          title: "Perceptron ≈ Artificial Neuron",
          definition: "A biological neuron receives signals through dendrites, integrates them in the cell body, and sends a spike along the axon. A perceptron does the same idea with numbers: weighted inputs → sum → activation → output.",
          body: "Each input x<sub>i</sub> is multiplied by a weight w<sub>i</sub>. The unit adds a <strong>bias</strong>, applies an <strong>activation function</strong> f, and emits one output — like a neuron that either fires or stays quiet.",
          extra: `<div class="example-box"><b>FORMULA</b>output = f( Σ (w<sub>i</sub> × x<sub>i</sub>) + bias )</div>`,
          render(sceneEl, caption) {
            sceneEl.innerHTML = `<div class="frame">
              <div class="neuron-diagram">
                <img src="../F2 AI assets/img/neuron-diagram.png" alt="Biological neuron and artificial neuron (perceptron) diagram" />
              </div>
            </div>${caption("Biological parts map to artificial parts: dendrites≈inputs, cell body≈Σ+f, axon≈output.")}`;
          }
        },
        {
          code: "03",
          name: "Layers",
          title: "Multilayer Neural Network",
          definition: "A multilayer network connects neurons in layers: an input layer, one or more hidden layers, and an output layer.",
          body: "Information flows <strong>forward</strong> from input → hidden → output. Hidden layers extract features the output layer uses for the final decision (e.g. “cat” or “dog”). More hidden units can capture richer patterns.",
          extra: `<div class="pair-grid"><div class="pair-card"><b>INPUT LAYER</b>Raw features (pixel values, sensor readings).</div><div class="pair-card"><b>OUTPUT LAYER</b>Final prediction or class label.</div></div>`,
          render(sceneEl, caption) {
            sceneEl.innerHTML = `<div class="frame">
              <div class="net-stage">
                <div class="layer in">
                  <span class="layer-label">INPUT</span>
                  <div class="layer-node"></div>
                  <div class="layer-node"></div>
                  <div class="layer-node"></div>
                </div>
                <span class="layer-arrow">→</span>
                <div class="layer hidden">
                  <span class="layer-label">HIDDEN</span>
                  <div class="layer-node"></div>
                  <div class="layer-node"></div>
                  <div class="layer-node"></div>
                  <div class="layer-node"></div>
                </div>
                <span class="layer-arrow">→</span>
                <div class="layer out">
                  <span class="layer-label">OUTPUT</span>
                  <div class="layer-node"></div>
                  <div class="layer-node"></div>
                </div>
              </div>
            </div>${caption("Nodes light sequentially: input layer → hidden layer → output layer.")}`;
          }
        },
        {
          code: "04",
          name: "Deep",
          title: "Deep Neural Network (DNN)",
          definition: "A Deep Neural Network is an ANN with many hidden layers — “deep” refers to the depth (number of layers), not the complexity of a single neuron.",
          body: "Each additional hidden layer can learn higher-level features: early layers detect edges; deeper layers combine them into shapes, objects, or concepts. Modern AI (image recognition, speech, language) often relies on DNNs with dozens or hundreds of layers.",
          extra: `<div class="example-box"><b>DEPTH</b>More layers → richer feature hierarchy — but also needs more data and compute to train well.</div>`,
          render(sceneEl, caption) {
            // Horizontal DNN: Input(5) → Hidden×3(5) → Output(3)
            const xs = [70, 170, 270, 370, 480];
            const counts = [5, 5, 5, 5, 3];
            const kinds = ["in", "hid", "hid", "hid", "out"];
            const top = 78;
            const gap = 34;
            const r = 13;

            function ys(n) {
              const h = (n - 1) * gap;
              const start = top + (4 * gap - h) / 2;
              return Array.from({ length: n }, (_, i) => start + i * gap);
            }

            const layers = counts.map((n, li) => ys(n).map((y) => ({ x: xs[li], y, kind: kinds[li] })));

            let edges = "";
            for (let li = 0; li < layers.length - 1; li++) {
              layers[li].forEach((a) => {
                layers[li + 1].forEach((b) => {
                  edges += `<line class="edge live e${li}" x1="${a.x + r}" y1="${a.y}" x2="${b.x - r}" y2="${b.y}"/>`;
                });
              });
            }

            const packets = [0, 1, 2, 3].map((i) => {
              const midX = (xs[i] + xs[i + 1]) / 2;
              const midY = (layers[i][2] || layers[i][0]).y;
              return `<circle class="packet p${i}" cx="${midX}" cy="${midY}" r="3.5"/>`;
            }).join("");

            const nodes = layers.map((nodesInLayer, li) => `
              <g class="L${li}">
                ${nodesInLayer.map((n) =>
                  `<circle class="node ${n.kind} glow" cx="${n.x}" cy="${n.y}" r="${r}"/>`
                ).join("")}
              </g>`).join("");

            sceneEl.innerHTML = `<div class="frame">
              <div class="dnn-wrap" aria-hidden="true">
                <svg class="dnn-svg" viewBox="0 0 560 280" role="img">
                  <text class="title" x="28" y="36">Deep neural network</text>
                  <text class="layer-cap" x="70" y="58">Input layer</text>
                  <text class="layer-cap" x="270" y="58">Multiple hidden layer</text>
                  <text class="layer-cap" x="480" y="58">Output layer</text>
                  ${edges}
                  ${packets}
                  ${nodes}
                </svg>
              </div>
            </div>${caption("Signal flows left → right: input → many hidden layers → output, nodes light in waves.")}`;
          }
        },
        {
          code: "05",
          name: "Classify",
          title: "MNIST Digit Classification",
          definition: "MNIST images are 28×28 grayscale digits. Flatten turns the image into 784 input pixels, which flow through hidden layers (e.g. 128 → 64) to 10 output scores for digits 0–9.",
          body: "Watch the DNN path: <strong>28×28 image → Flatten → Input (784) → Hidden (128, 64) → Output (10 digits)</strong>. The brightest output node is the predicted class.",
          extra: `<div class="example-box"><b>READING THE DIAGRAM</b>Many thin lines = dense connections between layers. Animation lights layers left → right, then highlights the winning digit.</div>`,
          render(sceneEl, caption) {
            // Digit "6" as small pixel art (12×12)
            const six = [
              "00111100",
              "01100110",
              "01100000",
              "01111000",
              "01111110",
              "01100110",
              "01100110",
              "00111100"
            ];
            const pxSize = 4;
            const imgX = 28;
            const imgY = 130;
            let digitRects = "";
            six.forEach((row, r) => {
              row.split("").forEach((bit, c) => {
                if (bit === "1") {
                  digitRects += `<rect class="digit-px" x="${imgX + 6 + c * pxSize}" y="${imgY + 8 + r * pxSize}" width="${pxSize - 0.5}" height="${pxSize - 0.5}"/>`;
                }
              });
            });

            function col(x, n, top, gap) {
              const h = (n - 1) * gap;
              const start = top + (220 - h) / 2;
              return Array.from({ length: n }, (_, i) => ({ x, y: start + i * gap }));
            }

            // Visible neurons (schematic of 784 / 128 / 64 / 10)
            const L0 = col(210, 14, 78, 15);   // input sample
            const L1 = col(340, 12, 78, 17);   // 128
            const L2 = col(450, 8, 78, 22);    // 64
            const L3 = col(580, 10, 78, 21);   // 0-9
            const layers = [L0, L1, L2, L3];

            let edges = "";
            for (let li = 0; li < 3; li++) {
              layers[li].forEach((a, ai) => {
                layers[li + 1].forEach((b, bi) => {
                  // denser look but skip some for clarity
                  if ((ai + bi) % 2 === 0 || li === 2) {
                    edges += `<line class="edge live e${li}" x1="${a.x + 7}" y1="${a.y}" x2="${b.x - 7}" y2="${b.y}"/>`;
                  }
                });
              });
            }

            const nodes = layers.map((nodesInL, li) => `
              <g class="L${li}">
                ${nodesInL.map((n, i) => {
                  if (li === 3) {
                    return `<g class="${i === 6 ? "out-win" : ""}" transform="translate(${n.x} ${n.y})">
                      <circle class="node" r="10"/>
                      <text class="out-lab" x="0" y="0">${i}</text>
                    </g>`;
                  }
                  return `<circle class="node" cx="${n.x}" cy="${n.y}" r="7"/>`;
                }).join("")}
              </g>`).join("");

            sceneEl.innerHTML = `<div class="frame">
              <div class="mnist-dnn-wrap" aria-hidden="true">
                <svg class="mnist-dnn" viewBox="0 0 720 360" role="img">
                  <defs>
                    <marker id="mnArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
                    </marker>
                  </defs>

                  <!-- MNIST image -->
                  <rect class="digit-bg" x="${imgX}" y="${imgY}" width="46" height="46" rx="4"/>
                  ${digitRects}
                  <text class="lab-mute" x="${imgX + 23}" y="${imgY + 62}">28 × 28 Image</text>

                  <!-- Flatten -->
                  <line class="flat-arrow" x1="80" y1="153" x2="175" y2="153"/>
                  <text class="lab-mute" x="128" y="145">Flatten</text>

                  <!-- Boxes -->
                  <rect class="box" x="190" y="62" width="40" height="240"/>
                  <rect class="box" x="300" y="62" width="180" height="240"/>
                  <rect class="box" x="545" y="62" width="70" height="240"/>

                  <!-- Labels kept clear of circles -->
                  <text class="lab" x="112" y="88">Input Layer</text>
                  <text class="lab-red" x="210" y="40">784 Input Pixels</text>
                  <text class="lab-red" x="340" y="40">128 neurons</text>
                  <text class="lab-red" x="450" y="40">64 neurons</text>
                  <text class="lab-mute" x="390" y="322">Hidden Layer</text>
                  <text class="lab-red" x="580" y="40">10 digits</text>
                  <text class="lab" x="512" y="322">Output Layer</text>

                  ${edges}
                  ${nodes}

                  <text class="pred" x="360" y="348">PREDICTION → <tspan>6</tspan></text>
                </svg>
              </div>
            </div>${caption("28×28 MNIST → flatten to 784 → hidden 128 & 64 → output digits 0–9; class 6 lights up.")}`;
          }
        },
        {
          code: "06",
          name: "Data",
          title: "DNNs Still Need Good Training Data",
          definition: "A powerful network architecture cannot compensate for poor training data — DNNs learn whatever patterns (or mistakes) the dataset provides.",
          body: "Even deep models suffer from <strong>small</strong>, <strong>noisy</strong>, or <strong>unbalanced</strong> datasets. Architecture gives capacity to learn; <strong>data quality</strong> determines what is actually learned. Train M<sub>0</sub> → M* with care, then test on unseen examples.",
          extra: `<div class="example-box"><b>REMEMBER</b>Architecture gives capacity; labelled, balanced, clean training data is what the network actually learns from.</div>`,
          render(sceneEl, caption) {
            sceneEl.innerHTML = `<div class="frame">
              <div class="link-stage">
                <div class="link-row">
                  <div class="link-chip ann">DNN<br><span style="font-weight:500;color:var(--muted)">many layers</span></div>
                  <span class="link-eq">+</span>
                  <div class="link-chip data">GOOD DATA<br><span style="font-weight:500;color:var(--muted)">size · labels · balance</span></div>
                  <span class="link-eq">=</span>
                  <div class="link-chip" style="border-color:var(--success);color:var(--success)">RELIABLE<br>M*</div>
                </div>
                <div class="formula-strip">
                  Architecture alone ≠ success<br>
                  <span style="color:var(--primary)">Train well · Test on unseen data</span>
                </div>
              </div>
            </div>${caption("Deep architecture + quality training data → a model that generalises.")}`;
          }
        }
      ],
      summary: {
        title: "Learning summary",
        p: "The brain relays signals through connected neurons; ANNs copy that idea with layers of artificial units — and still need good training data.",
        jump: "Sum",
        items: [
          { b: "BRAIN", span: "Keywords trigger neurons; firing hops along connections until a conclusion." },
          { b: "ANN", span: "Computing system inspired by biological neural networks in the brain." },
          { b: "PERCEPTRON", span: "Inputs × weights → sum → activation → output." },
          { b: "LAYERS", span: "Input → hidden → output; information flows forward." },
          { b: "DNN", span: "ANN with many hidden layers — learns hierarchical features." },
          { b: "MNIST", span: "28×28 image → flatten 784 → hidden 128/64 → output digits 0–9." },
          { b: "DATA", span: "Even deep networks need sufficient, clean, balanced training data." }
        ]
      }
    });
  </script>
  </body>
</html>
